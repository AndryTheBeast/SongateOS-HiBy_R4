name: 💡 Feature request
description: An idea for SongateOS.
title: "[Idea] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas for the music app itself (library, playback, playlists, lyrics) belong to [Songate's issues](https://github.com/AndryTheBeast/Songate/issues). This form is for the player: sound hardware, buttons, lights, Bluetooth, updates, the recovery.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like SongateOS to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware involved
      description: If it's about a device, which one (earbuds, DAC, headphones, a USB device), with its model.
